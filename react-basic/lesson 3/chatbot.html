<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <link rel="stylesheet" href="style.css">
		<style>
			body {
				font-family: 'Arial';
				margin: 0;
			}

			.send-button {
				background-color: rgb(229, 171, 24);
				color: whitesmoke;
				padding: 12px 20px;
				margin-left: 10px;
				border: none;
				border-radius: 10px;
				font-size: 15px;
				cursor: pointer;
			}

			.chat-input {
				padding: 12px 15px;
				border-radius: 10px;
				border-width: 1px;
				font-size: 15px;
				flex-grow: 1;
			}

			.chat-input-container {
				display: flex;
				margin-bottom: 60px;
			}

			.app-container {
				max-width: 600px;
				margin-left: auto;
				margin-right: auto;
				height: 100vh;
				display: flex;
				flex-direction: column;
			}

			.chat-message-user {
				display: flex;
				justify-content: end;
				align-items: start;
			}

			.chat-message-robot {
				display: flex;
				align-items: start;
			}

			.chat-message-text {
				background-color: rgb(238, 238, 238);
				padding: 15px 20px;
				border-radius: 10px;
				margin-right: 10px;
				margin-left: 10px;
				margin-bottom: 20px;
				max-width: 300px;
			}

			.chat-message-profile {
				width: 45px;
			}

			.chat-messages-container {
				flex-grow: 1;
				margin-top: 20px;
				overflow-y: scroll;
				scrollbar-width: none;
				scroll-behavior: smooth;
			}

		</style>
  </head>
  
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
		<script type="text/babel">

			function ChatInput({ chatMessages, setChatMessages }) {
				const [inputText, setInputText] = React.useState('');
				const [isLoading, setIsLoading] = React.useState(false);

				function saveInputText(event) {
					 setInputText(event.target.value);
				}

				async function sendMessage() {
					console.log(inputText);

          if (isLoading || inputText === '') {
            return;
          }

          // Set isLoading to true at the start, and set it to
          // false after everything is done.
          setIsLoading(true);

					setInputText('');

					const newChatMessages = [
						...chatMessages,
						{
							message: inputText,
							sender: 'user',
							id: crypto.randomUUID()
						}
					];

					setChatMessages([
						...newChatMessages,
						{
							message: 'Loading...',
							sender: 'robot',
							id: crypto.randomUUID()
						}
					]);

					const response = inputText === "Who is Amit?" 
						? "Amit is Cognivanta CEO and Inder's favourite"
					  : await Chatbot.getResponse(inputText);
					
					console.log(response);

					setChatMessages([
						...newChatMessages,
						{
							message: response,
							sender: 'robot',
							id: crypto.randomUUID()
						}
					]);

 					setIsLoading(false);
					setInputText('');
				}

				function handleKeyDown(event) {
					if(event.key === 'Enter') {
						sendMessage();
					} else if(event.key === 'Escape') {
						setInputText('');
					}
				}

				return (
					<div className="chat-input-container">
						<input 
							placeholder="Send a message to Chatbot"
							size="30" 
							onChange={saveInputText}
							value={inputText}
							onKeyDown={handleKeyDown}
							className="chat-input"
						/>
						<button
						  className="send-button"
							onClick={sendMessage}
						>Send
						</button>
					</div>
				);
			}

			function ChatMessage(props) {
				console.log(props)
				// const message = props.message;
				// const sender = props.sender;
				const { message, sender } = props;

				/*
				if (sender === "robot") {
					return(
						<div>
							<img src="../images/bot.png" width="50px"/>
							{message}
						</div>
					);

				}
				*/

				return(
					<div className={
						sender === 'user'
						? 'chat-message-user' 
						: 'chat-message-robot'
					}>
						{sender === "robot" && (
							<img src="../images/bot.png" className="chat-message-profile" />
						)}
						<div className="chat-message-text">
							{message}
						</div>
						{sender === "user" && (
							<img src="../images/user.png" className="chat-message-profile" />
						)}
					</div>
				);
			}

			function ChatMessages({ chatMessages }) {
				const chatMessagesRef = React.useRef(null);

				React.useEffect(() => {
					const containerElem = chatMessagesRef.current;
					if (containerElem) {
						// make the container down to bottom
						containerElem.scrollTop = containerElem.scrollHeight;
					}
				}, [chatMessages]);

				const chatMessageComponents = chatMessages.map((chatMessage) => {
					return (
						<ChatMessage
							message={chatMessage.message}
							sender={chatMessage.sender}
							key={chatMessage.id} 
 						/>
					);
				})

				
				return(
					<div 
						className="chat-messages-container"
						ref={chatMessagesRef}
					>
						{chatMessageComponents}
					</div>	
				);

				
			}

			function App() {
				
				const array = React.useState([{
					message: 'hello chatbot',
					sender: 'user',
					id: 'id1'
				},
				{
					message: 'Hello! How can I help you?',
					sender: 'robot',
					id: 'id2'
				},
				{
					message: `Can you get me today's date?`,
					sender: 'user',
					id: 'id3'
				},
				{
					message: 'Today is January 8',
					sender: 'robot',
					id: 'id4'
				}]);

				const [chatMessages, setChatMessages] = array;
				// const chatMessages = array[0];
				// const setChatMessages = array[1];
				

			return(
					<div className="app-container">
						<ChatMessages
								chatMessages={chatMessages}
						/>
						<ChatInput
								chatMessages={chatMessages}
								setChatMessages={setChatMessages}
						/>
					</div>	
				);
			}

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
			root.render(<App/>);
    </script>
  </body>
</html>
